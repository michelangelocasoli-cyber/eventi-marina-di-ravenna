name: Update events

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python collector.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EVENT_PLACE: "Marina di Ravenna"
          EVENT_DATE: "2026-09-12"
      - name: Commit database
        run: |
          git config user.name "event-aggregator"
          git config user.email "actions@users.noreply.github.com"
          git add events.db
          git diff --cached --quiet || git commit -m "Aggiorna eventi"
          git push
